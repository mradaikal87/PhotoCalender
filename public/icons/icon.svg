<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.18" flood-color="#000000" />
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="32" y="32" width="448" height="448" rx="80" ry="80" />
    </clipPath>
  </defs>

  <!-- Card with drop shadow -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="#ffffff" stroke="#e4e0d6" stroke-width="6" filter="url(#shadow)" />

  <!-- Clipped contents -->
  <g clip-path="url(#cardClip)">
    <!-- Header banner -->
    <rect x="32" y="32" width="448" height="170" fill="url(#headerGrad)" />

    <!-- Binder rings -->
    <rect x="130" y="10" width="36" height="64" rx="8" fill="#ffffff" opacity="0.95" />
    <rect x="346" y="10" width="36" height="64" rx="8" fill="#ffffff" opacity="0.95" />

    <!-- 2027 Header Text -->
    <text x="256" y="148" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">2027</text>

    <!-- Calendar Grid Mini Dots -->
    <g fill="#cbd5e1">
      <circle cx="120" cy="260" r="14" />
      <circle cx="210" cy="260" r="14" />
      <circle cx="300" cy="260" r="14" fill="#c2410c" />
      <circle cx="390" cy="260" r="14" />

      <circle cx="120" cy="330" r="14" />
      <circle cx="210" cy="330" r="14" />
      <circle cx="300" cy="330" r="14" />
      <circle cx="390" cy="330" r="14" fill="#ea580c" />

      <circle cx="120" cy="400" r="14" />
      <circle cx="210" cy="400" r="14" fill="#c2410c" />
      <circle cx="300" cy="400" r="14" />
      <circle cx="390" cy="400" r="14" />
    </g>
  </g>
</svg>
